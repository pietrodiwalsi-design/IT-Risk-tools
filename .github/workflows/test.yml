name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy jsonschema

      - name: Run engine test suite (regression gate)
        run: |
          pytest dashboard/test_monte_carlo.py -v

      - name: Validate built-in scenarios against shared/scenario.schema.json
        run: |
          pip install streamlit plotly matplotlib
          python3 - <<'PYEOF'
          import sys, json
          sys.path.insert(0, 'dashboard')
          from content import EXAMPLES
          import jsonschema

          with open('shared/scenario.schema.json') as f:
              schema = json.load(f)
          validator = jsonschema.Draft7Validator(schema)

          failed = False
          for name, ex in EXAMPLES.items():
              if ex is None:
                  continue
              scenario_obj = {
                  "name": name,
                  "description": ex.get("description", ""),
                  "currency": "EUR",
                  "lef": ex["lef"],
                  "lm": ex["lm"],
                  "lef_std": ex["lef_std"],
                  "lm_std": ex["lm_std"],
                  "control_cost": ex["control_cost"],
                  "post_ale": ex["post_ale"],
                  "likelihood": ex["likelihood"],
                  "exposure": ex["exposure"],
                  "consequence": ex["consequence"],
                  "source": "built-in-example",
              }
              errors = list(validator.iter_errors(scenario_obj))
              if errors:
                  failed = True
                  print(f"FAIL: {name}")
                  for e in errors:
                      print(f"  - {e.message}")
              else:
                  print(f"PASS: {name}")

          sys.exit(1 if failed else 0)
          PYEOF

      - name: Smoke-test Streamlit app boots without crashing
        run: |
          cd dashboard
          streamlit run app.py --server.headless true --server.port 8502 &
          sleep 6
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8502)
          echo "HTTP status: $STATUS"
          pkill -f "streamlit run app.py" || true
          if [ "$STATUS" != "200" ]; then
            echo "App did not respond with 200"
            exit 1
          fi
